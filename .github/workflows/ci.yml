# プルリクエストと main 以外への push で、型チェック・テスト・ビルドが通るか確かめる。
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # redirect/target-url.txt に書いた転送先を、マージ前に確かめる（README「PartyBox への引っ越し」）
      - run: node redirect/build.mjs "$RUNNER_TEMP/redirect-check"
